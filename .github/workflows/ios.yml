name: iOS

on:
  push:
    paths:
      - "DigitalCandle/**"
      - "DigitalCandle.xcodeproj/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and screenshot
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project DigitalCandle.xcodeproj \
            -scheme DigitalCandle \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots in the Simulator
        run: scripts/take-screenshots.sh build/Build/Products/Debug-iphonesimulator/DigitalCandle.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
